name: Automated Maintenance & Health Check

on:
  schedule:
    # 每周一、三、五 北京时间上午 10:00 自动触发 (UTC 02:00)
    - cron: '0 2 * * 1,3,5'
  workflow_dispatch: # 支持在 GitHub 网页后台随时手动点击触发

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run automated test suite
        run: |
          cd cli
          npm test

      - name: Update health status timestamp
        run: |
          mkdir -p .github
          echo "{\"last_verified\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\", \"status\": \"healthy\", \"platforms_monitored\": 9, \"engine\": \"Node.js 20+\"}" > .github/HEALTH.json

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/HEALTH.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(maintenance): 定期各平台规则与自动化健康状态同步 [skip ci]" && git push)
